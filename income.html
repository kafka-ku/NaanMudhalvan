<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Income Tracker</title>

    <link rel="stylesheet" href="income.css">
    <link rel="stylesheet" href="navbar.css">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="nav-brand">
            💰 Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">🏠 Dashboard</a>

            <a href="income.html">💰 Income</a>

            <a href="index.html">💸 Expense</a>

            <a href="analytics.html">📊 Analytics</a>

            <a href="report.html">📄 Report</a>

            <a href="login.html" id="logoutBtn">
                🚪 Logout
            </a>

        </div>

    </nav>


    <!-- Header -->

    <header class="income-header">

        <h1>Income Tracker</h1>

        <p>Manage your income records</p>

    </header>


    <main class="income-container">


        <!-- Add Income -->

        <section class="income-form-section">

            <h2>Add Income</h2>

            <form id="incomeForm">


                <div class="form-group">

                    <label for="incomeSource">
                        Income Source
                    </label>

                    <select
                        id="incomeSource"
                        required
                    >

                        <option value="">
                            Select Source
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Freelance">
                            Freelance
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="incomeAmount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="incomeAmount"
                        placeholder="Enter amount"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="incomeDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="incomeDate"
                        required
                    >

                </div>


                <button type="submit">
                    Add Income
                </button>

            </form>

        </section>


        <!-- Income History -->

        <section class="income-history">

            <div class="section-header">

                <h2>
                    Income History
                </h2>

                <button id="clearIncome">
                    Clear All
                </button>

            </div>


            <div id="incomeList">

                <p class="empty-message">
                    No income records found.
                </p>

            </div>

        </section>

    </main>


    <script src="auth.js"></script>
    <script src="navbar.js"></script>
    <script src="income.js"></script>

</body>

</html>
