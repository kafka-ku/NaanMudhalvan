<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Analytics - Expense Tracker</title>

    <link rel="stylesheet" href="analytics.css">
    <link rel="stylesheet" href="navbar.css">

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="nav-brand">
            💰 Expense Tracker
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="income.html">
                💰 Income
            </a>

            <a href="index.html">
                💸 Expense
            </a>

            <a href="analytics.html">
                📊 Analytics
            </a>

            <a href="report.html">
                📄 Report
            </a>

            <a href="login.html" id="logoutBtn">
                🚪 Logout
            </a>

        </div>

    </nav>


    <header class="analytics-header">

        <h1>
            Financial Analytics
        </h1>

        <p>
            Analyze your income and expenses
        </p>

    </header>


    <main class="analytics-container">


        <!-- Overview -->

        <section class="analytics-overview">


            <div class="analytics-card">

                <h3>
                    Total Income
                </h3>

                <p id="analyticsIncome">
                    ₹0
                </p>

            </div>


            <div class="analytics-card">

                <h3>
                    Total Expense
                </h3>

                <p id="analyticsExpense">
                    ₹0
                </p>

            </div>


            <div class="analytics-card">

                <h3>
                    Savings
                </h3>

                <p id="analyticsSavings">
                    ₹0
                </p>

            </div>


            <div class="analytics-card">

                <h3>
                    Expense Percentage
                </h3>

                <p id="expensePercentage">
                    0%
                </p>

            </div>

        </section>


        <!-- Income Expense Chart -->

        <section class="chart-section">

            <h2>
                Income vs Expense
            </h2>

            <canvas id="incomeExpenseChart"></canvas>

        </section>


        <!-- Category Chart -->

        <section class="chart-section">

            <h2>
                Expense by Category
            </h2>

            <canvas id="categoryExpenseChart"></canvas>

        </section>


        <!-- Monthly Analysis -->

        <section class="monthly-analysis">

            <h2>
                Monthly Analysis
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Month
                            </th>

                            <th>
                                Income
                            </th>

                            <th>
                                Expense
                            </th>

                            <th>
                                Savings
                            </th>

                        </tr>

                    </thead>


                    <tbody id="monthlyTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="auth.js"></script>
    <script src="navbar.js"></script>
    <script src="analytics.js"></script>

</body>

</html>
